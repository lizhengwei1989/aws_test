name: Deploy to EC2 Node.js

# 触发条件：当代码推送到 main 分支时[citation:3][citation:5]
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：检出代码（为了让 Actions 运行环境能访问你的仓库文件）[citation:3][citation:11]
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：通过 SSH 连接并执行部署命令
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 关键：通过 env 将 GitHub Secrets 映射为远程服务器上的环境变量
          envs: |
            AWS_ACCESS_KEY_ID,
            AWS_SECRET_ACCESS_KEY,
            AWS_BUCKET_NAME,
            AWS_REGION,
          # 在 EC2 上要执行的脚本，这是核心[citation:3][citation:11]
          script: |
            echo "AWS_REGION: $AWS_REGION"
            echo "AWS_BUCKET_NAME: $AWS_BUCKET_NAME"
            echo "AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:0:4}...${AWS_ACCESS_KEY_ID: -4}"
            echo "AWS_SECRET_ACCESS_KEY: ${#AWS_SECRET_ACCESS_KEY} characters long"
            git config --global --add safe.directory '*'
            cd /home/ec2-user/aws_test/node
            git fetch origin main
            git reset --hard origin/main
            npm install
            pm2 restart ecosystem.config.cjs
